<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product details - Nordivia Biopharmaceuticals">
    <title>Product Details | Nordivia Biopharmaceuticals</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header" id="header">
        <div class="container">
            <nav class="nav">
                <a href="index.html" class="logo">
                    <img src="./logo2.jpg" alt="Logo Norvidia">
                    Norvidia
                </a>

                <ul class="nav-menu" id="navMenu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#sobre">About</a></li>
                    <li><a href="produtos.html">Products</a></li>
                    <li><a href="index.html#contato">Contact</a></li>
                </ul>

                <div class="nav-actions">
                    <a href="carrinho.html" class="cart-link" aria-label="Shopping cart">
                        <span class="cart-icon">🛒</span>
                        <span class="cart-badge" style="display: none;">0</span>
                    </a>
                    <button class="nav-toggle" id="navToggle" aria-label="Open menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <!-- HERO PRODUTOS -->
    <section class="hero-produtos">
        <div class="hero-background">
            <img src="./img/hero.png" alt="Nordivia Biopharmaceuticals" class="hero-bg-image">
            <div class="hero-overlay"></div>
        </div>
        <div class="container">
            <div class="hero-produtos-content">
                <a href="produtos.html" class="btn btn-voltar">← Back to Products</a>
                <h1 id="produto-titulo">Loading...</h1>
                <p id="produto-subtitulo"></p>
            </div>
        </div>
    </section>

    <!-- DETALHES DO PRODUTO -->
    <section class="detalhes-section">
        <div class="container">
            <div class="detalhes-grid">
                <div class="detalhes-imagem">
                    <img id="produto-imagem" src="" alt="">
                </div>
                <div class="detalhes-info">
                    <h2 id="produto-nome"></h2>
                    <p class="detalhes-categoria" id="produto-categoria"></p>

                    <div class="detalhes-descricao">
                        <h3>Description</h3>
                        <p id="produto-descricao"></p>
                    </div>

                    <div class="detalhes-especificacoes">
                        <h3>Specifications</h3>
                        <div class="specs-grid">
                            <div class="spec-item">
                                <span class="spec-label">Category</span>
                                <span class="spec-value" id="spec-categoria"></span>
                            </div>
                            <div class="spec-item">
                                <span class="spec-label">Dosage</span>
                                <span class="spec-value" id="spec-dosagem"></span>
                            </div>
                            <div class="spec-item">
                                <span class="spec-label">Presentation Form</span>
                                <span class="spec-value" id="spec-forma"></span>
                            </div>
                            <div class="spec-item">
                                <span class="spec-label">Storage</span>
                                <span class="spec-value" id="spec-armazenamento"></span>
                            </div>
                            <div class="spec-item">
                                <span class="spec-label">Shelf Life</span>
                                <span class="spec-value" id="spec-validade"></span>
                            </div>
                        </div>
                    </div>

                    <div class="detalhes-botoes">
                        <button type="button" id="btn-adicionar-carrinho"
                            class="btn btn-carrinho btn-adicionar-carrinho">Add to Cart</button>
                        <a href="javascript:void(0)" id="btn-comprar" class="btn btn-comprar">Buy Now</a>
                        <a href="produtos.html" class="btn btn-detalhes">View Other Products</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- LIGHTBOX ZOOM -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button type="button" class="lightbox-close" id="lightbox-fechar" aria-label="Close image">×</button>
        <img src="" alt="" class="lightbox-img" id="lightbox-imagem">
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="./logo2.jpg" alt="Logo Norvidia">
                    <span>Norvidia</span>
                </div>
                <p class="footer-text">© 2008 Norvidia Biopharmaceuticals. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="produtos-data.js"></script>
    <script src="cart.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            (window.PRODUTOS_PROMISE || Promise.resolve()).then(function () {
                const urlParams = new URLSearchParams(window.location.search);
                const produtoId = urlParams.get('id');
                const btnAdicionar = document.getElementById('btn-adicionar-carrinho');

                if (produtoId) {
                    const produto = produtos.find(p => p.id === produtoId);

                    if (produto) {
                        document.title = `${produto.nome} | Nordivia Biopharmaceuticals`;
                        document.getElementById('produto-titulo').textContent = produto.nome;
                        document.getElementById('produto-subtitulo').textContent = produto.categoria;
                        document.getElementById('produto-imagem').src = produto.imagem;
                        document.getElementById('produto-imagem').alt = produto.nome;
                        document.getElementById('produto-nome').textContent = produto.nome;
                        document.getElementById('produto-categoria').textContent = produto.categoria;
                        document.getElementById('produto-descricao').textContent = produto.descricaoCompleta;

                        document.getElementById('spec-categoria').textContent = produto.categoria;
                        document.getElementById('spec-dosagem').textContent = produto.dosagem;
                        document.getElementById('spec-forma').textContent = produto.formaApresentacao;
                        document.getElementById('spec-armazenamento').textContent = produto.armazenamento;
                        document.getElementById('spec-validade').textContent = produto.prazoValidade;

                        document.getElementById('btn-comprar').href = `checkout.html?id=${produto.id}`;
                        btnAdicionar.setAttribute('data-id', produto.id);
                    } else {
                        document.getElementById('produto-titulo').textContent = 'Product not found';
                        btnAdicionar.style.display = 'none';
                    }
                } else {
                    document.getElementById('produto-titulo').textContent = 'Product not specified';
                    btnAdicionar.style.display = 'none';
                }

                const imagem = document.getElementById('produto-imagem');
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-imagem');
                const lightboxFechar = document.getElementById('lightbox-fechar');

                function abrirZoom() {
                    if (!imagem.src) return;
                    lightboxImg.src = imagem.src;
                    lightboxImg.alt = imagem.alt;
                    lightbox.classList.add('open');
                    lightbox.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                }

                function fecharZoom() {
                    lightbox.classList.remove('open');
                    lightbox.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                }

                imagem.addEventListener('click', abrirZoom);
                lightboxFechar.addEventListener('click', fecharZoom);
                lightbox.addEventListener('click', function (e) {
                    if (e.target === lightbox) {
                        fecharZoom();
                    }
                });
                document.addEventListener('keydown', function (e) {
                    if (e.key === 'Escape') {
                        fecharZoom();
                    }
                });
            });
        });
    </script>
</body>

</html>
